<div class="body">
    <div id="toolbar" class="flex-col flex-center">
        <div class="flex-row flex-size">
            @if (areItemsSelected) {
                <button class="negative-button" (click)="confirm('Möchtest du wirklich die aktuellen Mengen löschen?') && reset()">
                    <svg xmlns="http://www.w3.org/2000/svg" height="100%" viewBox="0 -960 960 960" width="100%" fill="currentColor"><path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/></svg>
                </button>
                <button class="store-button" (click)="openStorage()">
                    <!-- Store -->
                    <svg xmlns="http://www.w3.org/2000/svg" height="100%" viewBox="0 -960 960 960" width="100%" fill="currentColor"><path d="m480-240 160-160-56-56-64 64v-168h-80v168l-64-64-56 56 160 160ZM200-640v440h560v-440H200Zm0 520q-33 0-56.5-23.5T120-200v-499q0-14 4.5-27t13.5-24l50-61q11-14 27.5-21.5T250-840h460q18 0 34.5 7.5T772-811l50 61q9 11 13.5 24t4.5 27v499q0 33-23.5 56.5T760-120H200Zm16-600h528l-34-40H250l-34 40Zm264 300Z"/></svg>
                </button>
            } @else {
                <button class="negative-button" (click)="confirm('Zuletzte Eingabe zurückholen?') && revertSubmit()"
                        [disabled]="!(storage.getLatestSavedItems().length > 0)">
                    <svg xmlns="http://www.w3.org/2000/svg" height="100%" viewBox="0 -960 960 960" width="100%" fill="currentColor"><path d="M280-320h400v-80H280v80Zm0-160h160v-60h-57q20-19 45-29.5t52-10.5q47 0 83.5 27.5T614-480h62q-14-70-69-115t-127-45q-39 0-75.5 15T340-582v-58h-60v160ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg>
                </button>
                <button class="store-button" (click)="openStorage()" [disabled]="storage.getTabs().length <= 0">
                    <!-- Unstore -->
                    <svg xmlns="http://www.w3.org/2000/svg" height="100%" viewBox="0 -960 960 960" width="100%" fill="currentColor"><path d="M480-560 320-400l56 56 64-64v168h80v-168l64 64 56-56-160-160Zm-280-80v440h560v-440H200Zm0 520q-33 0-56.5-23.5T120-200v-499q0-14 4.5-27t13.5-24l50-61q11-14 27.5-21.5T250-840h460q18 0 34.5 7.5T772-811l50 61q9 11 13.5 24t4.5 27v499q0 33-23.5 56.5T760-120H200Zm16-600h528l-34-40H250l-34 40Zm264 300Z"/></svg>
                </button>
            }

            <h1 id="price">{{ price | currency: 'EUR' }}</h1>
            <button (click)="submit()">Kassieren</button>
        </div>
    </div>

    <div class="flex-col flex-size">
        @for (row of itemRows; track row[0].index) {
            <div class="flex-row flex-size">
                @for (item of row; track item.index) {
                    <app-item-box class="item-box"
                                  [ngStyle]="{'font-weight': !item.amount ? 'normal' : 'bold'}"
                                  [item]="item"
                                  (clickAction)="clickItem(item)"
                                  (holdAction)="holdItem(item)"></app-item-box>
                }
            </div>
        } @empty {
            <p>Keine Items</p>
        }
    </div>
</div>
